# Alentour CI: core tests against a real Postgres, both typechecks, taxonomy validation.
name: alentour-ci

on:
  push:
    paths: ["alentour/**", ".github/workflows/alentour-ci.yml"]
  pull_request:
    paths: ["alentour/**"]

permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: postgres }
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
    defaults:
      run: { working-directory: alentour }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: alentour/package-lock.json }
      - run: npm ci
      - run: npm run taxonomy:check
      - run: npm run typecheck
      - run: npm run db:reset
      - run: npm run catalog:export -- --out ./out
      - run: npm test

  app:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run: { working-directory: alentour/app }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: alentour/app/package-lock.json }
      - run: npm ci
      - run: npm run typecheck
      - name: Web bundle builds
        run: npx expo export --platform web --output-dir /tmp/web
        env: { EXPO_NO_TELEMETRY: "1" }
